<!DOCTYPE html><html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обнаружение машин — офлайн</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    #video-container {
      position: relative;
      max-width: 900px;
      margin: 20px auto;
    }
    #video {
      width: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    input[type="file"] {
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <h2>🎥 Обнаружение машин — локальная версия</h2>  <p>
    Выберите локальное <strong>видео (.mp4)</strong> и файл <strong>разметки (.json)</strong>
  </p>  <input type="file" id="videoInput" accept="video/mp4">
  <input type="file" id="jsonInput" accept="application/json">  <div id="video-container">
    <video id="video" controls></video>
    <canvas id="overlay"></canvas>
  </div>  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    let boxesBySecond = {};

    document.getElementById('videoInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
      }
    });

    document.getElementById('jsonInput').addEventListener('change', e => {
      const reader = new FileReader();
      reader.onload = event => {
        try {
          boxesBySecond = JSON.parse(event.target.result);
        } catch (err) {
          alert("Ошибка в JSON: " + err);
        }
      };
      reader.readAsText(e.target.files[0]);
    });

    function drawBoxesForTime(currentTime) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const key = currentTime.toFixed(1);
      const boxes = boxesBySecond[key] || [];

      boxes.forEach(box => {
        const [x, y, w, h, label] = box;
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.font = "16px Arial";
        ctx.fillStyle = "lime";
        ctx.fillText(label, x, y - 5);
      });
    }

    video.addEventListener('loadedmetadata', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    });

    video.addEventListener('timeupdate', () => {
      drawBoxesForTime(video.currentTime);
    });
  </script></body>
</html>
