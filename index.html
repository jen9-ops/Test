<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VCore-OS v2</title>
  <style>
    body { margin: 0; background: #111; color: #0f0; font-family: monospace; }
    #desktop { position: relative; height: 80vh; overflow: hidden; background: #000; }
    .window {
      position: absolute;
      background: #111;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 5px;
      width: 200px;
      height: 120px;
      resize: both;
      overflow: auto;
    }
    .title-bar {
      cursor: move;
      font-weight: bold;
      margin-bottom: 4px;
    }
    #terminal {
      height: 20vh;
      background: #000;
      border-top: 2px solid #0f0;
      padding: 10px;
      box-sizing: border-box;
    }
    #input {
      width: 100%;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="terminal">
    <div>> Введіть команди VCX нижче:</div>
    <textarea id="input" rows="6">// Пример:
SET clicks = 0
OPEN WINDOW "Clicker" WIDTH 250 HEIGHT 120
PRINT "Clicker" "Привіт, Женя!"
WAIT 1000
INC clicks
PRINT "Clicker" "Кліків: " + clicks
IF clicks > 0 THEN
  PRINT "Clicker" "Перше натискання!"
END
</textarea>
    <button onclick="run()">▶ Виконати</button>
  </div>  <script>
    const desktop = document.getElementById('desktop');
    const windows = {};
    const vars = {};

    function createWindow(id, w = 200, h = 120) {
      if (windows[id]) return;
      const win = document.createElement('div');
      win.className = 'window';
      win.style.width = w + 'px';
      win.style.height = h + 'px';
      win.style.left = '50px';
      win.style.top = '50px';

      const title = document.createElement('div');
      title.className = 'title-bar';
      title.textContent = id;
      win.appendChild(title);

      const content = document.createElement('div');
      content.className = 'content';
      win.appendChild(content);

      makeDraggable(win, title);
      desktop.appendChild(win);
      windows[id] = win;
    }

    function makeDraggable(win, handle) {
      let isDragging = false, offsetX, offsetY;
      handle.onmousedown = e => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      };
      document.onmousemove = e => {
        if (!isDragging) return;
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      };
      document.onmouseup = () => isDragging = false;
    }

    async function run() {
      const input = document.getElementById("input").value.trim().split("\n");
      let skip = false;
      for (let i = 0; i < input.length; i++) {
        let line = input[i].trim();
        if (!line || line.startsWith("//")) continue;
        const tokens = line.match(/\"[^\"]+\"|\S+/g)?.map(t => t.replace(/\"/g, "")) || [];
        const cmd = tokens[0];

        if (cmd === "SET") {
          vars[tokens[1]] = parseInt(tokens[3]);
        } else if (cmd === "INC") {
          const v = tokens[1];
          vars[v] = (vars[v] || 0) + 1;
        } else if (cmd === "OPEN" && tokens[1] === "WINDOW") {
          createWindow(tokens[2], parseInt(tokens[4]), parseInt(tokens[6]));
        } else if (cmd === "PRINT") {
          const win = windows[tokens[1]];
          if (win) {
            let text = tokens.slice(2).join(" ");
            for (let key in vars) text = text.replaceAll(key, vars[key]);
            win.querySelector('.content').textContent += text + "\n";
          }
        } else if (cmd === "WAIT") {
          await new Promise(res => setTimeout(res, parseInt(tokens[1])));
        } else if (cmd === "IF") {
          const [left, op, right] = [tokens[1], tokens[2], tokens[3]];
          const lval = vars[left] ?? parseInt(left);
          const rval = vars[right] ?? parseInt(right);
          let result = false;
          if (op === ">") result = lval > rval;
          if (op === "<") result = lval < rval;
          if (op === "==") result = lval == rval;
          if (!result) skip = true;
        } else if (cmd === "END") {
          skip = false;
        } else if (skip) {
          continue;
        }
      }
    }
  </script></body>
</html>
