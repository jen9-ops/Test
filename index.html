<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Редактор HTML/CSS/JS</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://esm.sh/@codemirror/theme-one-dark@6.2.1/theme.css" />

  <style>
    body {
      background-color: #121212;
      color: #fff;
      padding-top: 30px;
    }
    .editor-wrapper {
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .btn-custom {
      background-color: #00bcd4;
      color: white;
    }
    .btn-custom:hover {
      background-color: #0097a7;
    }
    #console {
      white-space: pre-wrap;
      font-family: monospace;
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #333;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-top: 15px;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">🌐 Веб-Редактор HTML / CSS / JS</h1>

    <div class="form-check form-switch mb-3 text-end">
      <input class="form-check-input" type="checkbox" id="wrap-toggle">
      <label class="form-check-label" for="wrap-toggle">Перенос рядків (Word wrap)</label>
    </div>

    <div class="mb-3">
      <label class="form-label">HTML</label>
      <div id="html-editor" class="editor-wrapper"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">CSS</label>
      <div id="css-editor" class="editor-wrapper"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">JavaScript</label>
      <div id="js-editor" class="editor-wrapper"></div>
    </div>

    <div class="d-flex justify-content-center gap-3 mb-3 flex-wrap">
      <button class="btn btn-custom" id="run">▶ Виконати</button>
      <button class="btn btn-outline-light" id="save">💾 Зберегти</button>
      <button class="btn btn-outline-warning" id="show-console">🛠 Консоль</button>
      <label class="btn btn-outline-info" for="file-import">📂 Імпорт</label>
      <input type="file" id="file-import" accept=".html" />
    </div>

    <div id="console" class="d-none"></div>
  </div>

  <!-- CodeMirror -->
  <script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/@codemirror/basic-setup";
    import { html } from "https://esm.sh/@codemirror/lang-html";
    import { css } from "https://esm.sh/@codemirror/lang-css";
    import { javascript } from "https://esm.sh/@codemirror/lang-javascript";
    import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark";
    import { EditorState } from "https://esm.sh/@codemirror/state";

    let htmlEditor, cssEditor, jsEditor;
    let wrapExtension = [];

    const wrapToggle = document.getElementById("wrap-toggle");

    function makeEditor(parent, language, storageKey, defaultValue) {
      const saved = localStorage.getItem(storageKey) || defaultValue;
      return new EditorView({
        doc: saved,
        extensions: [basicSetup, language(), oneDark, ...wrapExtension],
        parent: parent
      });
    }

    function applyWrap(editor, enabled) {
      editor.dispatch({
        effects: EditorView.lineWrapping.reconfigure(
          enabled ? EditorView.lineWrapping : []
        )
      });
    }

    window.addEventListener("load", () => {
      htmlEditor = makeEditor(document.getElementById("html-editor"), html, "htmlCode", "<h1>Привіт, світ!</h1>");
      cssEditor = makeEditor(document.getElementById("css-editor"), css, "cssCode", "h1 { color: lightgreen; }");
      jsEditor = makeEditor(document.getElementById("js-editor"), javascript, "jsCode", "console.log('Працює!');");

      document.getElementById("run").onclick = runCode;
      document.getElementById("save").onclick = saveCode;
      document.getElementById("show-console").onclick = () => {
        document.getElementById("console").classList.toggle("d-none");
      };

      // Word wrap toggle
      wrapToggle.addEventListener("change", () => {
        const wrap = wrapToggle.checked;
        applyWrap(htmlEditor, wrap);
        applyWrap(cssEditor, wrap);
        applyWrap(jsEditor, wrap);
      });

      // Автосохранение
      setInterval(() => {
        localStorage.setItem("htmlCode", htmlEditor.state.doc.toString());
        localStorage.setItem("cssCode", cssEditor.state.doc.toString());
        localStorage.setItem("jsCode", jsEditor.state.doc.toString());
      }, 2000);

      // Импорт из файла
      document.getElementById("file-import").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          htmlEditor.dispatch({ changes: { from: 0, to: htmlEditor.state.doc.length, insert: content } });
        };
        reader.readAsText(file);
      });
    });

    function runCode() {
      const htmlCode = htmlEditor.state.doc.toString();
      const cssCode = `<style>${cssEditor.state.doc.toString()}</style>`;
      const jsCode = `<script>
        try {
          ${jsEditor.state.doc.toString()}
        } catch (e) {
          window.opener?.postMessage('[JS Error] ' + e.message, '*');
        }
      <\/script>`;

      const code = `<!DOCTYPE html><html><head>${cssCode}</head><body>${htmlCode}${jsCode}</body></html>`;
      const win = window.open();
      if (win) {
        win.document.write(code);
        win.document.close();
        window.addEventListener("message", e => {
          const box = document.getElementById("console");
          box.classList.remove("d-none");
          box.textContent += e.data + "\n";
        });
      } else {
        alert("Браузер заблокував спливаюче вікно.");
      }
    }

    function saveCode() {
      const htmlCode = htmlEditor.state.doc.toString();
      const cssCode = `<style>${cssEditor.state.doc.toString()}</style>`;
      const jsCode = `<script>${jsEditor.state.doc.toString()}<\/script>`;
      const blob = new Blob(
        [`<!DOCTYPE html><html><head>${cssCode}</head><body>${htmlCode}${jsCode}</body></html>`],
        { type: "text/html" }
      );
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }
  </script>
</body>
</html>
