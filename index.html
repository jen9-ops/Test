<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн редактор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: white; padding: 20px; }
    .tab-content textarea {
      width: 100%;
      height: 60vh;
      background: #1e1e1e;
      color: #ffffff;
      font-family: monospace;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      resize: vertical;
    }
    #console {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h1 class="text-center mb-4">🌐 Онлайн редактор HTML/CSS/JS</h1><ul class="nav nav-tabs" id="editorTabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="html-tab" data-bs-toggle="tab" data-bs-target="#html" type="button" role="tab">HTML</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="css-tab" data-bs-toggle="tab" data-bs-target="#css" type="button" role="tab">CSS</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="js-tab" data-bs-toggle="tab" data-bs-target="#js" type="button" role="tab">JavaScript</button>
  </li>
</ul>

<div class="tab-content mt-3">
  <div class="tab-pane fade show active" id="html" role="tabpanel">
    <textarea id="htmlCode" placeholder="HTML код..."></textarea>
  </div>
  <div class="tab-pane fade" id="css" role="tabpanel">
    <textarea id="cssCode" placeholder="CSS код..."></textarea>
  </div>
  <div class="tab-pane fade" id="js" role="tabpanel">
    <textarea id="jsCode" placeholder="JavaScript код..."></textarea>
  </div>
</div>

<div class="mt-4 d-flex flex-wrap gap-3 justify-content-center">
  <button class="btn btn-primary" onclick="runCode()">▶ Виконати</button>
  <button class="btn btn-success" onclick="saveCode()">💾 Зберегти</button>
  <button class="btn btn-warning" onclick="toggleConsole()">🛠 Консоль</button>
  <input type="file" id="importFile" accept=".html" onchange="importFile(event)" hidden>
  <label class="btn btn-info" for="importFile">📂 Імпорт</label>
</div>

<div id="console"></div>

  </div>  <script>
    function runCode() {
      const html = document.getElementById("htmlCode").value;
      const css = `<style>${document.getElementById("cssCode").value}</style>`;const js = `<script>try {${document.getElementById("jsCode").value}} catch(e) { window.opener?.postMessage('[JS Error] ' + e.message, '*'); }<\/script>`;
  const win = window.open();
  if (win) {
    win.document.write(`<!DOCTYPE html><html><head>${css}</head><body>${html}${js}</body></html>`);
    win.document.close();
  } else {
    alert("Браузер заблокував спливаюче вікно.");
  }
}

function saveCode() {
  const html = document.getElementById("htmlCode").value;
  const css = `<style>${document.getElementById("cssCode").value}</style>`;
  const js = `<script>${document.getElementById("jsCode").value}<\/script>`;
  const content = `<!DOCTYPE html><html><head>${css}</head><body>${html}${js}</body></html>`;
  const blob = new Blob([content], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "index.html";
  link.click();
}

function toggleConsole() {
  const box = document.getElementById("console");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function importFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    document.getElementById("htmlCode").value = event.target.result;
  };
  reader.readAsText(file);
}

window.addEventListener("message", e => {
  const consoleBox = document.getElementById("console");
  consoleBox.style.display = "block";
  consoleBox.textContent += e.data + "\n";
});

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
