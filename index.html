<script>
  function updatePreview() {
    const html = document.getElementById("htmlCode").value;
    const css = document.getElementById("cssCode").value;
    const js = document.getElementById("jsCode").value;
    const combined = `<!DOCTYPE html>
<html>
<head>
<style>${css}</style></head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>`;
    const codeEl = document.getElementById("preview");
    codeEl.textContent = combined;
    Prism.highlightElement(codeEl);
  }// Автосохранение в localStorage setInterval(() => { localStorage.setItem("editor-html", document.getElementById("htmlCode").value); localStorage.setItem("editor-css", document.getElementById("cssCode").value); localStorage.setItem("editor-js", document.getElementById("jsCode").value); updatePreview(); }, 1500);

window.addEventListener("DOMContentLoaded", () => { document.getElementById("htmlCode").value = localStorage.getItem("editor-html") || ""; document.getElementById("cssCode").value = localStorage.getItem("editor-css") || ""; document.getElementById("jsCode").value = localStorage.getItem("editor-js") || ""; updatePreview(); }); </script>

  <script>
    function runCode() {
      const html = document.getElementById("htmlCode").value;
      const css = `<style>${document.getElementById("cssCode").value}</style>`;const js = `<script>try {${document.getElementById("jsCode").value}} catch(e) { window.opener?.postMessage('[JS Error] ' + e.message, '*'); }<\/script>`;
  const win = window.open();
  if (win) {
    win.document.write(`<!DOCTYPE html><html><head>${css}</head><body>${html}${js}</body></html>`);
    win.document.close();
  } else {
    alert("Браузер заблокував спливаюче вікно.");
  }
}

function saveCode() {
  const html = document.getElementById("htmlCode").value;
  const css = `<style>${document.getElementById("cssCode").value}</style>`;
  const js = `<script>${document.getElementById("jsCode").value}<\/script>`;
  const content = `<!DOCTYPE html><html><head>${css}</head><body>${html}${js}</body></html>`;
  const blob = new Blob([content], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "index.html";
  link.click();
}

function toggleConsole() {
  const box = document.getElementById("console");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function clearEditors() {
  document.getElementById("htmlCode").value = "";
  document.getElementById("cssCode").value = "";
  document.getElementById("jsCode").value = "";
  document.getElementById("console").textContent = "";
}

function importFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    document.getElementById("htmlCode").value = event.target.result;
  };
  reader.readAsText(file);
}

window.addEventListener("message", e => {
  const consoleBox = document.getElementById("console");
  consoleBox.style.display = "block";
  consoleBox.textContent += e.data + "\n";
});

  </script>
