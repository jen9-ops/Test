<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Стабільний редактор HTML/CSS/JS</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/theme/material.css">

  <style>
    :root {
      --bg:#1f2530;
      --card:#232a3b;
      --radius:6px;
    }
    body {
      background: var(--bg);
      color: #f0f0f5;
      min-height:100vh;
      padding:16px;
    }
    .CodeMirror {
      height: 55vh;
      border-radius: var(--radius);
      font-size:14px;
      background: #1f273a;
    }
    .editor-label {
      font-weight:600;
      margin-bottom:4px;
    }
    #console {
      background: #0d0f19;
      border:1px solid #444;
      border-radius:6px;
      padding:10px;
      font-family: monospace;
      color:#ff9f7f;
      max-height:180px;
      overflow-y:auto;
      margin-top:12px;
      white-space:pre-wrap;
    }
    .alert-placeholder {
      position: fixed;
      top: 16px;
      right:16px;
      z-index:1050;
      width: auto;
    }
    .small-muted {
      font-size:0.75rem;
      color:#999;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <button class="btn btn-primary" id="runBtn">▶ Виконати</button>
      <button class="btn btn-success" id="saveBtn">💾 Зберегти</button>
      <button class="btn btn-secondary" id="loadLastBtn">📥 Завантажити останнє</button>
      <button class="btn btn-danger" id="clearBtn">🧹 Очистити</button>
      <label class="btn btn-info mb-0">
        📂 Імпорт HTML
        <input type="file" id="importHtml" accept=".html" hidden />
      </label>
      <button class="btn btn-outline-light" id="toggleConsoleBtn">🛠 Консоль</button>
      <div class="form-check form-switch ms-auto">
        <input class="form-check-input" type="checkbox" id="wrapToggle" checked>
        <label class="form-check-label text-light" for="wrapToggle">Перенос рядків</label>
      </div>
    </div>

    <div id="alerts" class="alert-placeholder"></div>

   

    <ul class="nav nav-tabs" id="tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-html" data-bs-toggle="tab" data-bs-target="#html" type="button">HTML</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-css" data-bs-toggle="tab" data-bs-target="#css" type="button">CSS</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-js" data-bs-toggle="tab" data-bs-target="#js" type="button">JavaScript</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="html" role="tabpanel">
        <div class="mb-1 editor-label">HTML</div>
        <textarea id="editor-html"></textarea>
        <div class="small-muted">Вставляється в &lt;body&gt;.</div>
      </div>
      <div class="tab-pane fade" id="css" role="tabpanel">
        <div class="mb-1 editor-label">CSS</div>
        <textarea id="editor-css"></textarea>
        <div class="small-muted">Вставляється в &lt;head&gt; через &lt;style&gt;.</div>
      </div>
      <div class="tab-pane fade" id="js" role="tabpanel">
        <div class="mb-1 editor-label">JavaScript</div>
        <textarea id="editor-js"></textarea>
        <div class="small-muted">Виконується в кінці &lt;body&gt;.</div>
      </div>
    </div>

    <div id="console" class="d-none"></div>
  </div>

  <!-- Скрипты -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/xml/xml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/javascript/javascript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/css/css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/htmlmixed/htmlmixed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/addon/edit/closebrackets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/addon/edit/matchbrackets.js"></script>

  <script>
    // Утилиты
    function showMessage(text, type = 'info', duration = 1500) {
      const container = document.getElementById('alerts');
      const div = document.createElement('div');
      div.className = `alert alert-${type} py-2 mb-2`;
      div.role = 'alert';
      div.style.minWidth = '200px';
      div.textContent = text;
      container.appendChild(div);
      setTimeout(() => {
        div.classList.add('fade');
        div.style.transition = 'opacity .4s';
        div.style.opacity = '0';
      }, duration);
      setTimeout(() => div.remove(), duration + 500);
    }

    // Инициализация CodeMirror
    const htmlEditor = CodeMirror.fromTextArea(document.getElementById('editor-html'), {
      mode: 'htmlmixed',
      theme: 'material',
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      lineWrapping: true
    });
    const cssEditor = CodeMirror.fromTextArea(document.getElementById('editor-css'), {
      mode: 'css',
      theme: 'material',
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      lineWrapping: true
    });
    const jsEditor = CodeMirror.fromTextArea(document.getElementById('editor-js'), {
      mode: 'javascript',
      theme: 'material',
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      lineWrapping: true
    });

    const consoleBox = document.getElementById('console');

    // Загрузка из localStorage
    function loadSaved() {
      htmlEditor.setValue(localStorage.getItem('editor_html') || '<h1>Привіт, світ!</h1>');
      cssEditor.setValue(localStorage.getItem('editor_css') || 'body { font-family: sans-serif; }');
      jsEditor.setValue(localStorage.getItem('editor_js') || "console.log('JS працює');");
    }
    loadSaved();

    // Автосохранение (дебаунс)
    let saveTimer;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem('editor_html', htmlEditor.getValue());
        localStorage.setItem('editor_css', cssEditor.getValue());
        localStorage.setItem('editor_js', jsEditor.getValue());
        showMessage('Автозбережено', 'success', 800);
      }, 600);
    }
    htmlEditor.on('change', scheduleSave);
    cssEditor.on('change', scheduleSave);
    jsEditor.on('change', scheduleSave);

    // Перенос рядків
    document.getElementById('wrapToggle').addEventListener('change', e => {
      const wrap = e.target.checked;
      [htmlEditor, cssEditor, jsEditor].forEach(ed => ed.setOption('lineWrapping', wrap));
    });

    // Кнопки
    document.getElementById('runBtn').addEventListener('click', () => {
      consoleBox.textContent = '';
      consoleBox.classList.remove('d-none');

      const html = htmlEditor.getValue();
      const css = `<style>${cssEditor.getValue()}</style>`;
      const userJs = jsEditor.getValue();

      const payload = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
${css}
</head>
<body>
${html}
<script>
  window.onerror = function(msg, url, line, col, err) {
    window.opener.postMessage('[JS Error] ' + msg + ' (' + line + ':' + col + ')', '*');
  };
  try {
    ${userJs}
  } catch(e) {
    window.opener.postMessage('[JS Exception] ' + e.message, '*');
  }
<\/script>
</body>
</html>`;

      const w = window.open();
      if (!w) {
        showMessage('Спливаюче вікно заблоковано. Скопіюй URL вручну.', 'warning', 2200);
        const blob = new Blob([payload], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        consoleBox.textContent += 'Відкрий вручну: ' + url + '\n';
        return;
      }
      w.document.open();
      w.document.write(payload);
      w.document.close();
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const html = htmlEditor.getValue();
      const css = `<style>${cssEditor.getValue()}</style>`;
      const js = `<script>${jsEditor.getValue()}<\/script>`;
      const content = `<!DOCTYPE html><html><head>${css}</head><body>${html}${js}</body></html>`;
      const blob = new Blob([content], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
      showMessage('Збережено як index.html', 'primary', 1300);
    });

    document.getElementById('loadLastBtn').addEventListener('click', () => {
      loadSaved();
      showMessage('Завантажено останнє з локального сховища', 'info', 1200);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      htmlEditor.setValue('');
      cssEditor.setValue('');
      jsEditor.setValue('');
      consoleBox.textContent = '';
    });

    // Імпорт HTML
    document.getElementById('importHtml').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const fr = new FileReader();
      fr.onload = ev => htmlEditor.setValue(ev.target.result);
      fr.readAsText(file);
    });

    // Переключатель консоли
    document.getElementById('toggleConsoleBtn').addEventListener('click', () => {
      consoleBox.classList.toggle('d-none');
    });

    // Отрисовка сообщений из окна результата
    window.addEventListener('message', e => {
      consoleBox.classList.remove('d-none');
      consoleBox.textContent += e.data + '\n';
    });
  </script>
</body>
</html>
