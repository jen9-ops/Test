<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Редактор HTML/CSS/JS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://esm.sh/@codemirror/theme-one-dark@6.2.1/theme.css" />
  <style>
    body { background-color: #121212; color: #fff; padding-top: 20px; }
    .editor-wrapper { min-height: 50vh; max-height: 70vh; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; }
    .btn-custom { background-color: #00bcd4; color: white; }
    .btn-custom:hover { background-color: #0097a7; }
    #console { white-space: pre-wrap; font-family: monospace; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; padding: 10px; height: 200px; overflow-y: auto; margin-top: 15px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h1 class="text-center">🌐 Веб-Редактор HTML / CSS / JS</h1><ul class="nav nav-tabs mb-3" id="editorTabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="html-tab" data-bs-toggle="tab" data-bs-target="#html" type="button" role="tab">HTML</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="css-tab" data-bs-toggle="tab" data-bs-target="#css" type="button" role="tab">CSS</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="js-tab" data-bs-toggle="tab" data-bs-target="#js" type="button" role="tab">JavaScript</button>
  </li>
</ul>

<div class="tab-content">
  <div class="tab-pane fade show active" id="html" role="tabpanel">
    <div id="html-editor" class="editor-wrapper w-100"></div>
  </div>
  <div class="tab-pane fade" id="css" role="tabpanel">
    <div id="css-editor" class="editor-wrapper w-100"></div>
  </div>
  <div class="tab-pane fade" id="js" role="tabpanel">
    <div id="js-editor" class="editor-wrapper w-100"></div>
  </div>
</div>

<div class="form-check form-switch mb-3 text-end">
  <input class="form-check-input" type="checkbox" id="wrap-toggle">
  <label class="form-check-label" for="wrap-toggle">Перенос рядків (Word wrap)</label>
</div>

<div class="d-flex justify-content-center gap-3 mb-3 flex-wrap">
  <button class="btn btn-custom" id="run">▶ Виконати</button>
  <button class="btn btn-outline-light" id="save">💾 Зберегти</button>
  <button class="btn btn-outline-warning" id="show-console">🛠 Консоль</button>
  <label class="btn btn-outline-info" for="file-import">📂 Імпорт</label>
  <input type="file" id="file-import" accept=".html" />
</div>

<div id="console" class="d-none"></div>

  </div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>  <script type="module">
    import { EditorView, basicSetup, lineNumbers } from "https://esm.sh/@codemirror/basic-setup";
    import { html } from "https://esm.sh/@codemirror/lang-html";
    import { css } from "https://esm.sh/@codemirror/lang-css";
    import { javascript } from "https://esm.sh/@codemirror/lang-javascript";
    import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark";
    import { lineWrapping } from "https://esm.sh/@codemirror/view";
    import { EditorState } from "https://esm.sh/@codemirror/state";

    let htmlEditor, cssEditor, jsEditor;

    function createEditor(container, language, storageKey, defaultValue) {
      return new EditorView({
        state: EditorState.create({
          doc: localStorage.getItem(storageKey) || defaultValue,
          extensions: [basicSetup, lineNumbers(), language(), oneDark]
        }),
        parent: container
      });
    }

    function updateWrap(enabled) {
      const ext = enabled ? [lineWrapping] : [];
      [htmlEditor, cssEditor, jsEditor].forEach((editor, idx) => {
        const lang = idx === 0 ? html() : idx === 1 ? css() : javascript();
        editor.dispatch({
          effects: EditorView.reconfigure.of([
            basicSetup,
            lineNumbers(),
            lang,
            oneDark,
            ...ext
          ])
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      htmlEditor = createEditor(document.getElementById("html-editor"), html, "htmlCode", "<h1>Привіт, світ!</h1>");
      cssEditor = createEditor(document.getElementById("css-editor"), css, "cssCode", "h1 { color: lightgreen; }");
      jsEditor = createEditor(document.getElementById("js-editor"), javascript, "jsCode", "console.log('Працює!');");

      document.getElementById("wrap-toggle").addEventListener("change", e => updateWrap(e.target.checked));

      setInterval(() => {
        localStorage.setItem("htmlCode", htmlEditor.state.doc.toString());
        localStorage.setItem("cssCode", cssEditor.state.doc.toString());
        localStorage.setItem("jsCode", jsEditor.state.doc.toString());
      }, 2000);

      document.getElementById("file-import").addEventListener("change", e => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = ev => htmlEditor.dispatch({ changes: { from: 0, to: htmlEditor.state.doc.length, insert: ev.target.result } });
        r.readAsText(f);
      });

      document.getElementById("run").onclick = () => {
        const htmlCode = htmlEditor.state.doc.toString();
        const cssCode = `<style>${cssEditor.state.doc.toString()}</style>`;const jsCode = `<script>${jsEditor.state.doc.toString()}<\/script>`;
    const content = `<!DOCTYPE html><html><head>${cssCode}</head><body>${htmlCode}${jsCode}</body></html>`;
    const win = window.open();
    if (win) {
      win.document.write(content);
      win.document.close();
    } else {
      alert("Браузер заблокував спливаюче вікно.");
    }
  };

  document.getElementById("save").onclick = () => {
    const htmlCode = htmlEditor.state.doc.toString();
    const cssCode = `<style>${cssEditor.state.doc.toString()}</style>`;
    const jsCode = `<script>${jsEditor.state.doc.toString()}<\/script>`;
    const blob = new Blob([
      `<!DOCTYPE html><html><head>${cssCode}</head><body>${htmlCode}${jsCode}</body></html>`
    ], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
  };

  document.getElementById("show-console").onclick = () => {
    document.getElementById("console").classList.toggle("d-none");
  };
});

  </script>
</body>
</html>
