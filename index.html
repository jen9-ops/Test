<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 VCore-OS v3 + Browser Buttons</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom right, #1b1c1d, #0f0f0f);
      color: #0f0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #desktop {
      position: relative;
      min-height: 60vh;
      background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 10px, #111 10px, #111 20px);
      overflow: hidden;
    }
    .window {
      position: absolute;
      background: #121212;
      border: 2px solid #0f0;
      color: #0f0;
      padding: 5px;
      width: 240px;
      height: 140px;
      resize: both;
      overflow: auto;
      box-shadow: 0 0 12px #0f08, 0 0 5px #0f0 inset;
      border-radius: 6px;
    }
    .title-bar {
      cursor: move;
      background: #0f0;
      color: #000;
      font-weight: bold;
      padding: 4px 6px;
      border-radius: 4px 4px 0 0;
    }
    #terminal {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 95%;
      max-width: 700px;
      background: #000;
      border: 2px solid #0f0;
      padding: 10px;
      box-sizing: border-box;
      z-index: 1000;
      box-shadow: 0 0 12px #0f08;
      border-radius: 6px;
    }
    #terminal .title-bar {
      background: #0f0;
      color: #000;
      margin: -10px -10px 10px -10px;
      border-radius: 6px 6px 0 0;
    }
    #input {
      width: 100%;
      background: #101010;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    #errors {
      color: #f55;
      margin-top: 6px;
      white-space: pre-wrap;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 6px 14px;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      box-shadow: 0 0 6px #0f04;
      cursor: pointer;
    }
    button:hover {
      background: #afff00;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
    }
    .browser-controls {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .browser-controls input {
      flex: 1;
      padding: 4px;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }
    .browser-controls button {
      padding: 4px 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="terminal">
    <div class="title-bar">🧠 VCX Термінал</div>
    <div>> Введіть команди VCX нижче:</div>
    <textarea id="input" rows="6">// Приклад:
OPEN BROWSER "Web1" WIDTH 600 HEIGHT 450
NAVIGATE "Web1" "https://example.com"</textarea>
    <button onclick="run()">▶ Виконати</button>
    <div id="errors"></div>
  </div>  <script>
    const desktop = document.getElementById('desktop');
    const windows = {};
    const vars = {};
    const terminal = document.getElementById("terminal");
    const terminalTitle = terminal.querySelector(".title-bar");
    const errorOutput = document.getElementById("errors");

    makeDraggable(terminal, terminalTitle);

    function createWindow(id, w = 240, h = 140, type = 'default') {
      if (windows[id]) return;

      const win = document.createElement('div');
      win.className = 'window';
      win.style.width = w + 'px';
      win.style.height = h + 'px';
      win.style.left = '50px';
      win.style.top = '50px';

      const title = document.createElement('div');
      title.className = 'title-bar';
      title.textContent = id;
      win.appendChild(title);

      const content = document.createElement('div');
      content.className = 'content';

      if (type === 'browser') {
        const controls = document.createElement('div');
        controls.className = 'browser-controls';

        const input = document.createElement('input');
        input.placeholder = 'https://example.com';

        const goBtn = document.createElement('button');
        goBtn.textContent = 'Перейти';

        const reloadBtn = document.createElement('button');
        reloadBtn.textContent = '🔁';

        const iframe = document.createElement('iframe');

        goBtn.onclick = () => iframe.src = input.value;
        reloadBtn.onclick = () => iframe.src = iframe.src;
        input.onkeydown = e => { if (e.key === 'Enter') iframe.src = input.value; };

        controls.appendChild(input);
        controls.appendChild(goBtn);
        controls.appendChild(reloadBtn);

        content.appendChild(controls);
        content.appendChild(iframe);
      }

      win.appendChild(content);
      makeDraggable(win, title);
      desktop.appendChild(win);
      windows[id] = win;
    }

    function makeDraggable(win, handle) {
      let isDragging = false, offsetX, offsetY;
      handle.onmousedown = e => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      };
      document.onmousemove = e => {
        if (!isDragging) return;
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      };
      document.onmouseup = () => isDragging = false;
    }

    async function run() {
      const input = document.getElementById("input").value.trim().split("\n");
      errorOutput.textContent = "";
      let skip = false;
      try {
        for (let i = 0; i < input.length; i++) {
          let line = input[i].trim();
          if (!line || line.startsWith("//")) continue;
          const match = line.match(/\"[^\"]+\"|\S+/g);
          const tokens = match ? match.map(t => t.replace(/\"/g, "")) : [];
          const cmd = tokens[0];

          if (cmd === "SET") {
            vars[tokens[1]] = parseInt(tokens[3]);
          } else if (cmd === "INC") {
            const v = tokens[1];
            vars[v] = (vars[v] || 0) + 1;
          } else if (cmd === "OPEN" && tokens[1] === "WINDOW") {
            createWindow(tokens[2], parseInt(tokens[4]), parseInt(tokens[6]));
          } else if (cmd === "OPEN" && tokens[1] === "BROWSER") {
            createWindow(tokens[2], parseInt(tokens[4]), parseInt(tokens[6]), 'browser');
          } else if (cmd === "PRINT") {
            const win = windows[tokens[1]];
            if (win) {
              let text = tokens.slice(2).join(" ");
              for (let key in vars) text = text.replaceAll(key, vars[key]);
              win.querySelector('.content').textContent += text + "\n";
            }
          } else if (cmd === "NAVIGATE") {
            const win = windows[tokens[1]];
            if (win) {
              const iframe = win.querySelector('iframe');
              const input = win.querySelector('input');
              if (iframe && input) {
                input.value = tokens[2];
                iframe.src = tokens[2];
              }
            }
          } else if (cmd === "WAIT") {
            await new Promise(res => setTimeout(res, parseInt(tokens[1])));
          } else if (cmd === "IF") {
            const [left, op, right] = [tokens[1], tokens[2], tokens[3]];
            const lval = vars[left] ?? parseInt(left);
            const rval = vars[right] ?? parseInt(right);
            let result = false;
            if (op === ">") result = lval > rval;
            if (op === "<") result = lval < rval;
            if (op === "==") result = lval == rval;
            if (!result) skip = true;
          } else if (cmd === "END") {
            skip = false;
          } else if (skip) {
            continue;
          } else {
            throw new Error(`Невідома команда: ${cmd}`);
          }
        }
      } catch (err) {
        errorOutput.textContent = "❌ Помилка: " + err.message;
      }
    }
  </script></body>
</html>
