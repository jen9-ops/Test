<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн редактор</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.css">
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>

  <style>
    :root { --bg:#0d0d0d; --border:#333; --green:#21c55d; --red:#ef4444; --blue:#60a5fa; --amber:#f59e0b; }
    body { background:var(--bg); color:#fff; padding:10px; font-family:sans-serif; }
    .top-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .CodeMirror { height:60vh; border-radius:8px; border:1px solid var(--border); }
    .editor-header { display:flex; justify-content:space-between; align-items:center; margin:8px 0 6px; }
    .clear-btn { font-size:0.8rem; padding:2px 8px; }

    /* Console drawer */
    #consoleWrap {
      position:fixed; bottom:0; left:0; right:0;
      background:#0a0f14; border-top:2px solid var(--border);
      transition:height 0.2s ease;
      height:0; display:flex; flex-direction:column;
      overflow:hidden; z-index:9999;
    }
    .c-head { display:flex; align-items:center; justify-content:space-between;
      padding:5px 10px; background:#111; cursor:ns-resize; user-select:none; touch-action:none; }
    .c-head .title { display:flex; align-items:center; gap:6px; }
    .dot{ width:10px; height:10px; border-radius:50%; background:var(--green); }
    .dot.err{ background:var(--red); }
    #console { flex:1; overflow:auto; font-family:ui-monospace,Consolas,monospace; padding:6px; white-space:pre-wrap; }
    .line { margin:2px 0; }
    .lvl.LOG{ color:#9fb0ca } .lvl.INFO{ color:var(--blue) } .lvl.WARN{ color:var(--amber) } .lvl.ERROR{ color:var(--red) }
    .console-input { display:flex; border-top:1px solid var(--border); }
    .console-input input { flex:1; background:#111; color:#fff; border:none; padding:8px; font-family:ui-monospace,Consolas,monospace; }
    .console-input button { background:#222; border:none; color:#fff; padding:8px 12px; }

    /* Modal / lists */
    .modal-content { background:#1b1f2a; color:#fff; }
    .list-group-item{ background:#0f1520; color:#e6e6e6; border-color:#223; }

    /* Tiny toast + autosave pill */
    #saveToast {
      position: fixed; top: 12px; right: 12px; background:#1f2a1f; color:#cfeccf;
      border:1px solid #2d4a2d; padding:8px 12px; border-radius:6px; display:none; z-index:10000;
    }
    .pill-saving { display:inline-block; padding:2px 8px; font-size:12px; border-radius:999px; background:#1c2533; color:#9fb0ca; margin-left:6px; }
    .pill-saving.blink { animation: b 1s ease-in-out infinite; }
    @keyframes b { 0%,100%{opacity:.5} 50%{opacity:1} }
  </style>
</head>
<body>

<div class="container-fluid">

  <!-- Top bar -->
  <div class="top-bar">
    <button class="btn btn-primary" id="runBtn">▶ Виконати</button>
    <button class="btn btn-outline-info" id="consoleToggleBtn">Консоль</button>

    <div class="dropdown">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Меню</button>
      <ul class="dropdown-menu">
        <li>
          <label class="dropdown-item"><input type="checkbox" id="wrapToggle"> Перенос по словам</label>
        </li>
        <li><a class="dropdown-item" href="#" id="saveProject">💾 Зберегти проект <span id="savingPill" class="pill-saving" style="display:none;">autosave</span></a></li>
        <li><a class="dropdown-item" href="#" id="exportHTML">⤵ Експортувати HTML</a></li>
        <li><a class="dropdown-item" href="#" id="mLibs">📚 Бібліотеки</a></li>
        <li>
          <label class="dropdown-item" for="importFile" style="cursor:pointer;">📂 Імпорт HTML</label>
          <input type="file" id="importFile" accept=".html,.htm" hidden>
        </li>
      </ul>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#htmlTab">HTML</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#cssTab">CSS</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#jsTab">JavaScript</button></li>
  </ul>

  <div class="tab-content mt-3">
    <div class="tab-pane fade show active" id="htmlTab">
      <div class="editor-header">
        <span>HTML</span>
        <button class="btn btn-sm btn-danger clear-btn" data-editor="html">Очистити</button>
      </div>
      <textarea id="htmlCode"></textarea>
    </div>

    <div class="tab-pane fade" id="cssTab">
      <div class="editor-header">
        <span>CSS</span>
        <button class="btn btn-sm btn-danger clear-btn" data-editor="css">Очистити</button>
      </div>
      <textarea id="cssCode"></textarea>
    </div>

    <div class="tab-pane fade" id="jsTab">
      <div class="editor-header">
        <span>JavaScript</span>
        <button class="btn btn-sm btn-danger clear-btn" data-editor="js">Очистити</button>
      </div>
      <textarea id="jsCode"></textarea>
    </div>
  </div>
</div>

<!-- Console drawer -->
<div id="consoleWrap">
  <div class="c-head" id="consoleDrag">
    <div class="title"><div id="cDot" class="dot"></div> <span>Консоль (<span id="cCount">0</span>)</span></div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-light" id="downloadLog">Завантажити лог</button>
      <button class="btn btn-sm btn-danger" id="clearLog">Очистити лог</button>
    </div>
  </div>
  <div id="console"></div>
  <div class="console-input">
    <input id="consoleCmd" placeholder="Введіть JS команду...">
    <button id="execCmd">▶</button>
  </div>
</div>

<!-- Modal: Libraries manager -->
<div class="modal fade" id="libsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Менеджер бібліотек</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 d-flex gap-2">
          <input id="libUrl" type="url" class="form-control" placeholder="https://cdn.jsdelivr.net/... або інший CDN">
          <button id="addLib" class="btn btn-primary">Додати</button>
        </div>
        <h6>Активні</h6>
        <ul id="activeLibs" class="list-group mb-3"></ul>
        <h6>Усі збережені</h6>
        <ul id="allLibs" class="list-group"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Tiny toast -->
<div id="saveToast">✅ Збережено</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // ===== Keys & State =====
  const LS_WRAP    = 'wrap_pref_v2';
  const LS_LIBS    = 'libsStore_v6';       // [{url, enabled}]
  const LS_PROJECT = 'editor_project_v3';  // {html, css, js, libs, ts}
  const $  = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  let editors={}, libsStore=loadLibs(), logCount=0, runWin=null;
  let dirty=false, autosaveTimer=null, periodicTimer=null;
  const logs = []; // сохраняем логи в памяти для повторного рендера
  const cmdHistory = []; let histIdx = -1;

  // ===== Helpers =====
  const debounce = (fn, ms=800) => (...args) => { clearTimeout(autosaveTimer); autosaveTimer=setTimeout(()=>fn(...args), ms); };
  const safeScript = s => String(s).replace(/<\/script>/gi, '<\\/script>');
  function showToast(msg='✅ Збережено'){ const t=$('#saveToast'); t.textContent=msg; t.style.display='block'; clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.style.display='none', 1000); }
  function setSavingPill(on){ const p=$('#savingPill'); p.style.display = on?'inline-block':'none'; p.classList.toggle('blink', on); }

  // кроссбраузерная нормализация URL + сортировка query-параметров
  function normalizeUrl(u){
    try{
      const url = new URL(u, location.href);
      url.hash = '';
      const entries = [...url.searchParams.entries()].sort(([a],[b])=>a.localeCompare(b));
      url.search = entries.length ? '?' + entries.map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&') : '';
      return url.toString();
    }catch{ return (u||'').trim(); }
  }
  function libsDedup(arr){
    const seen=new Set(); const out=[];
    for(const x of (arr||[])){
      const url = typeof x==='string' ? x : x.url;
      const enabled = typeof x==='string' ? true : x.enabled!==false;
      const norm = normalizeUrl(url);
      if(!seen.has(norm)){ seen.add(norm); out.push({url:norm, enabled}); }
    }
    return out;
  }

  // ===== Save/Load project (manual + autosave improved) =====
  function markDirty(){ dirty=true; setSavingPill(true); }
  function saveProject(){
    const payload = {
      html: editors.html.getValue(),
      css:  editors.css.getValue(),
      js:   editors.js.getValue(),
      libs: libsStore,
      wrap: getWrap(),
      ts:   Date.now()
    };
    localStorage.setItem(LS_PROJECT, JSON.stringify(payload));
    dirty=false; setSavingPill(false); showToast('✅ Збережено');
  }
  function loadProject(){
    try { return JSON.parse(localStorage.getItem(LS_PROJECT) || 'null'); }
    catch { return null; }
  }
  const debouncedSave = debounce(saveProject, 800);
  $('#saveProject').addEventListener('click', (e)=>{ e.preventDefault(); saveProject(); });

  // ===== Editors =====
  function initEditors(){
    const wrap = getWrap();
    editors.html = CodeMirror.fromTextArea($('#htmlCode'), { lineNumbers:true, mode:'htmlmixed',  theme:'dracula', lineWrapping:wrap });
    editors.css  = CodeMirror.fromTextArea($('#cssCode'),  { lineNumbers:true, mode:'css',        theme:'dracula', lineWrapping:wrap });
    editors.js   = CodeMirror.fromTextArea($('#jsCode'),   { lineNumbers:true, mode:'javascript', theme:'dracula', lineWrapping:wrap });

    // Load last project
    const saved = loadProject();
    if (saved) {
      editors.html.setValue(saved.html || '');
      editors.css.setValue(saved.css || '');
      editors.js.setValue(saved.js || '');
      if (Array.isArray(saved.libs)) libsStore = libsDedup(saved.libs);
      saveLibs();
    }

    // AUTOSAVE on change (debounced) + periodic if dirty
    Object.values(editors).forEach(ed => ed.on('change', ()=>{
      dirty=true; setSavingPill(true); debouncedSave();
    }));
    periodicTimer = setInterval(()=>{ if(dirty){ saveProject(); } }, 10000);
  }

  function getWrap(){ return localStorage.getItem(LS_WRAP)==='1'; }
  function setWrap(v){ localStorage.setItem(LS_WRAP, v?'1':'0'); Object.values(editors).forEach(ed=>ed.setOption('lineWrapping', v)); markDirty(); }
  $('#wrapToggle').checked = getWrap();
  $('#wrapToggle').addEventListener('change', e=>setWrap(e.target.checked));

  // Clear buttons per tab
  $$('.clear-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.editor;
      editors[key].setValue('');
    });
  });

  // ===== Console =====
  $('#consoleToggleBtn').addEventListener('click', ()=>toggleConsole(220));
  $('#clearLog').addEventListener('click', ()=>{
    logs.length=0; $('#console').innerHTML=''; logCount=0; $('#cCount').textContent='0'; $('#cDot').classList.remove('err');
  });
  $('#downloadLog').addEventListener('click', ()=>{
    const blob = new Blob([logs.map(l=>`[${l.level}] ${l.text}`).join('\n')], {type:'text/plain'});
    const a=document.createElement('a'); const href = URL.createObjectURL(blob);
    a.href=href; a.download='console.log'; a.click();
    setTimeout(()=>URL.revokeObjectURL(href), 0);
  });

  function toggleConsole(h){
    const wrap = $('#consoleWrap');
    const cur = parseInt(wrap.style.height||'0',10);
    wrap.style.height = cur>0 ? '0px' : (h+'px');
    if(cur===0){ renderLogs(); }
  }
  // Drag resize
  (function(){
    const drag = $('#consoleDrag'); const wrap = $('#consoleWrap');
    let startY=0, startH=0, dragging=false;
    const onMove = y=>{
      let nh = startH + (startY - y);
      const minH=120, maxH=Math.floor(window.innerHeight*0.9);
      nh = Math.max(minH, Math.min(maxH, nh));
      wrap.style.height = nh+'px';
    };
    drag.addEventListener('mousedown', e=>{
      dragging=true; startY=e.clientY; startH=parseInt(getComputedStyle(wrap).height,10)||0;
      document.body.style.userSelect='none';
    });
    window.addEventListener('mousemove', e=>{ if(dragging) onMove(e.clientY); });
    window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; });
    drag.addEventListener('touchstart', e=>{
      const t=e.touches[0]; dragging=true; startY=t.clientY; startH=parseInt(getComputedStyle(wrap).height,10)||0;
    }, {passive:true});
    window.addEventListener('touchmove', e=>{
      if(!dragging) return; const t=e.touches[0]; onMove(t.clientY);
    }, {passive:true});
    window.addEventListener('touchend', ()=>{ dragging=false; });
  })();

  function renderLogs(){
    const box = $('#console'); box.innerHTML='';
    for(const l of logs){ const div=document.createElement('div'); div.className='line';
      const lvl=document.createElement('span'); lvl.className='lvl '+l.level; lvl.textContent=l.level+':';
      div.appendChild(lvl); div.append(' '+l.text); box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  }
  function pushLog(level, text){
    logs.push({level, text}); // память
    const box = $('#console');
    if(parseInt($('#consoleWrap').style.height||'0',10)>0){
      const line=document.createElement('div'); line.className='line';
      const lvl=document.createElement('span'); lvl.className='lvl '+level; lvl.textContent=level+':';
      line.appendChild(lvl); line.append(' '+text); box.appendChild(line); box.scrollTop=box.scrollHeight;
    }
    logCount++; $('#cCount').textContent=String(logCount);
    $('#cDot').classList.toggle('err', level==='ERROR');
  }
  window.addEventListener('message', e=>{
    const d=e.data||{}; if(d.from!=='editor') return;
    const level=(d.type||'LOG').toUpperCase();
    const text =Array.isArray(d.data)?d.data.join(' '):String(d.data||'');
    pushLog(level, text);
  });

  // ===== Run =====
  $('#runBtn').addEventListener('click', ()=>{
    // закрыть предыдущее окно, чтобы не плодить
    if (runWin && !runWin.closed) runWin.close();

    const html = editors.html.getValue();
    const css  = `<style>${editors.css.getValue()}</style>`;
    const hooks = buildRunHooks() + buildLibTags(); // сначала hook, затем библиотеки — чтобы ловить их логи
    const js   = `<script>try{${safeScript(editors.js.getValue())}}catch(e){ console.error(e && e.message ? e.message : e); }<\/script>`;

    runWin = window.open();
    if(runWin){
      runWin.document.write(`<!DOCTYPE html><html><head>${css}${hooks}</head><body>${html}${js}</body></html>`);
      runWin.document.close();
      toggleConsole(220);
    } else {
      alert('Браузер заблокував спливаюче вікно.');
    }
  });

  function buildRunHooks(){
    return `<script>
      (function(){
        function S(v){ try{return (typeof v==='object')?JSON.stringify(v):String(v);}catch(_){return String(v)} }
        function send(type,args){ try{ window.opener && window.opener.postMessage({from:'editor',type,data:[].slice.call(args).map(S)}, '*'); }catch(e){} }
        ['log','info','warn','error'].forEach(function(k){ var o=console[k]; console[k]=function(){ send(k,arguments); try{o.apply(console,arguments)}catch(_){} };});
        window.addEventListener('error',e=>send('error',[ (e.message||'Error') + (e.filename?(' @ '+e.filename+':'+e.lineno):'') ]));
        window.addEventListener('unhandledrejection',e=>send('error',[ (e.reason && (e.reason.message||e.reason)) || 'Unhandled promise rejection' ]));
        window.execFromParent = function(cmd){
          try{ var r = eval(cmd); send('log', [r]); }
          catch(err){ send('error', [err && err.message ? err.message : String(err)]); }
        };
      })();
    <\/script>`;
  }

  // Interactive console input + history
  $('#execCmd').addEventListener('click', execCmd);
  const cmdInput = $('#consoleCmd');
  cmdInput.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ execCmd(); return; }
    if(e.key==='ArrowUp'){
      if(cmdHistory.length){ if(histIdx<0) histIdx=cmdHistory.length-1; else histIdx=Math.max(0, histIdx-1); cmdInput.value=cmdHistory[histIdx]; e.preventDefault(); }
    } else if(e.key==='ArrowDown'){
      if(cmdHistory.length){ if(histIdx>=cmdHistory.length-1){ histIdx=-1; cmdInput.value=''; } else { histIdx=Math.min(cmdHistory.length-1, histIdx+1); cmdInput.value=cmdHistory[histIdx]||''; } e.preventDefault(); }
    }
  });
  function execCmd(){
    const cmd = cmdInput.value;
    if(!cmd.trim()) return;
    cmdHistory.push(cmd); histIdx=-1;
    if(runWin && runWin.execFromParent){ runWin.execFromParent(cmd); }
    else { pushLog('ERROR','Вікно не запущено'); }
    cmdInput.value='';
  }

  // ===== Libraries manager =====
  function loadLibs(){
    try{
      const raw = localStorage.getItem(LS_LIBS);
      if(!raw) return [];
      return libsDedup(JSON.parse(raw));
    }catch{ return []; }
  }
  function saveLibs(){ localStorage.setItem(LS_LIBS, JSON.stringify(libsStore)); }
  function addLib(url, enable=true){
    url = normalizeUrl(url||''); if(!url) return;
    const ex = libsStore.find(l=>l.url===url);
    if(ex){ if(enable) ex.enabled=true; }
    else libsStore.push({url, enabled: !!enable});
    libsStore = libsDedup(libsStore);
    saveLibs(); renderLibs(); markDirty();
  }
  function removeLib(i){ libsStore.splice(i,1); saveLibs(); renderLibs(); markDirty(); }
  function toggleLib(i){ libsStore[i].enabled = !libsStore[i].enabled; saveLibs(); renderLibs(); markDirty(); }

  function renderLibs(){
    const active = $('#activeLibs');
    const all    = $('#allLibs');
    if(!active || !all) return;
    active.innerHTML=''; all.innerHTML='';

    libsStore.forEach((lib,i)=>{
      const tpl = () => {
        const li = document.createElement('li');
        li.className='list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML =
          `<span class="text-truncate" style="max-width:70%">${lib.url}</span>
           <div class="ms-2">
             <input type="checkbox" ${lib.enabled?'checked':''} data-idx="${i}" class="lib-toggle">
             <button class="btn btn-sm btn-danger ms-2 lib-del" data-idx="${i}">×</button>
           </div>`;
        return li;
      };
      const liAll = tpl(); all.appendChild(liAll);
      if(lib.enabled){ const liAct = tpl(); active.appendChild(liAct); }
    });

    all.querySelectorAll('.lib-toggle').forEach(chk=>chk.addEventListener('change', e=>toggleLib(parseInt(e.target.dataset.idx,10))));
    all.querySelectorAll('.lib-del').forEach(btn=>btn.addEventListener('click', e=>removeLib(parseInt(e.target.dataset.idx,10))));
    active.querySelectorAll('.lib-toggle').forEach(chk=>chk.addEventListener('change', e=>toggleLib(parseInt(e.target.dataset.idx,10))));
    active.querySelectorAll('.lib-del').forEach(btn=>btn.addEventListener('click', e=>removeLib(parseInt(e.target.dataset.idx,10))));
  }

  $('#addLib').addEventListener('click', ()=>{
    const url = $('#libUrl').value.trim();
    if(!url) return;
    addLib(url, true);
    $('#libUrl').value='';
  });

  $('#mLibs').addEventListener('click', (e)=>{
    e.preventDefault();
    renderLibs();
    new bootstrap.Modal($('#libsModal')).show();
  });

  // ===== Import + autoparser (do NOT remove tags with data-keep attr) =====
  $('#importFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try{ autoparseHTML(ev.target.result||''); saveProject(); }catch(err){ alert('Помилка парсингу: '+err.message); }
    };
    r.readAsText(f);
    e.target.value='';
  });

  function autoparseHTML(raw){
    const doc = new DOMParser().parseFromString(String(raw),'text/html');

    // external libs (add + remove)
    doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(l=>{
      if(l.hasAttribute('data-keep')) return; // не трогаем помеченные
      const href=l.getAttribute('href'); if(href) addLib(href,true); l.remove();
    });
    doc.querySelectorAll('script[src]').forEach(s=>{
      if(s.hasAttribute('data-keep')) return;
      const src=s.getAttribute('src'); if(src) addLib(src,true); s.remove();
    });

    // inline css/js (collect + remove), если НЕ data-keep
    const cssBlocks=[]; doc.querySelectorAll('style').forEach(st=>{
      if(st.hasAttribute('data-keep')) return;
      cssBlocks.push(st.textContent||''); st.remove();
    });
    const jsBlocks=[];  doc.querySelectorAll('script:not([src])').forEach(sc=>{
      if(sc.hasAttribute('data-keep')) return;
      jsBlocks.push(sc.textContent||''); sc.remove();
    });

    // clean HTML
    const cleanHTML = doc.body ? doc.body.innerHTML.trim() : '';

    editors.html.setValue(cleanHTML);
    editors.css.setValue(cssBlocks.join('\n\n').trim());
    editors.js.setValue(jsBlocks.map(safeScript).join('\n\n').trim());
  }

  // ===== Run helpers =====
  function buildLibTags(){
    return libsStore.filter(l=>l.enabled).map(l=>{
      const u=(l.url||'').trim().toLowerCase();
      return u.endsWith('.css') ? `<link rel="stylesheet" href="${l.url}">`
                                : `<script src="${l.url}"><\/script>`;
    }).join('');
  }

  // ===== Saving helpers =====
  function showSavedToast(){ showToast('✅ Збережено'); }
