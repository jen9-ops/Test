<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 VCore-OS v5</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom right, #1b1c1d, #0f0f0f);
      color: #0f0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 10px, #111 10px, #111 20px);
      overflow: hidden;
    }
    .window {
      position: absolute;
      background: #121212;
      border: 2px solid #0f0;
      color: #0f0;
      padding: 5px;
      width: 320px;
      height: 200px;
      resize: both;
      overflow: hidden;
      box-shadow: 0 0 12px #0f08, 0 0 5px #0f0 inset;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f0;
      color: #000;
      font-weight: bold;
      padding: 4px 6px;
      cursor: move;
      user-select: none;
      border-radius: 4px 4px 0 0;
    }
    .title-bar button {
      background: #000;
      color: #0f0;
      border: none;
      padding: 2px 6px;
      margin-left: 4px;
      cursor: pointer;
      border-radius: 3px;
    }
    .title-bar button:hover {
      background: #222;
    }
    .content {
      flex: 1;
      overflow: auto;
      padding: 5px;
    }
    #terminal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #000;
      border-top: 2px solid #0f0;
      padding: 10px;
      box-sizing: border-box;
      z-index: 1000;
      display: none;
    }
    #input {
      width: 100%;
      background: #101010;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    #errors {
      color: #f55;
      margin-top: 6px;
      white-space: pre-wrap;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 6px 14px;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      box-shadow: 0 0 6px #0f04;
      cursor: pointer;
    }
    button:hover {
      background: #afff00;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .browser-controls {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .browser-controls input {
      flex: 1;
      padding: 4px;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }
    #toggle-terminal {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #0f0;
      color: #000;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 14px;
      border-top-left-radius: 8px;
      cursor: pointer;
      z-index: 1100;
    }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="toggle-terminal" onclick="toggleTerminal()">Термінал</div>
  <div id="terminal">
    <textarea id="input" rows="4">MKDIR "/docs"
WRITE "/docs/hello.txt" "Привіт!"
READ "/docs/hello.txt"
LS "/docs"
RM "/docs/hello.txt"</textarea>
    <button onclick="run()">▶ Виконати</button>
    <div id="errors"></div>
  </div>  <script>
    const desktop = document.getElementById('desktop');
    const windows = {};
    const vars = {};
    const errorOutput = document.getElementById("errors");
    const terminal = document.getElementById("terminal");
    let fileSystem = JSON.parse(localStorage.getItem('vcore_fs')) || { "/": { type: "folder", children: {} } };

    function saveFS() {
      localStorage.setItem("vcore_fs", JSON.stringify(fileSystem));
    }

    function getPath(path) {
      const parts = path.split("/").filter(Boolean);
      let node = fileSystem["/"];
      for (let i = 0; i < parts.length; i++) {
        if (!node.children[parts[i]]) return null;
        node = node.children[parts[i]];
      }
      return node;
    }

    function mkdir(path) {
      const parts = path.split("/").filter(Boolean);
      let node = fileSystem["/"];
      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        if (!node.children[part]) {
          node.children[part] = { type: "folder", children: {} };
        }
        node = node.children[part];
      }
      saveFS();
    }

    function writeFile(path, content) {
      const parts = path.split("/").filter(Boolean);
      const fileName = parts.pop();
      let node = fileSystem["/"];
      for (let i = 0; i < parts.length; i++) {
        node = node.children[parts[i]];
        if (!node || node.type !== "folder") return;
      }
      node.children[fileName] = { type: "file", content };
      saveFS();
    }

    function readFile(path) {
      const file = getPath(path);
      return file && file.type === "file" ? file.content : null;
    }

    function listDir(path) {
      const dir = getPath(path);
      return dir && dir.type === "folder" ? Object.keys(dir.children) : [];
    }

    function removePath(path) {
      const parts = path.split("/").filter(Boolean);
      const fileName = parts.pop();
      let node = fileSystem["/"];
      for (let i = 0; i < parts.length; i++) {
        node = node.children[parts[i]];
        if (!node || node.type !== "folder") return;
      }
      delete node.children[fileName];
      saveFS();
    }

    function toggleTerminal() {
      terminal.style.display = terminal.style.display === 'none' ? 'block' : 'none';
    }

    async function run() {
      const input = document.getElementById("input").value.trim().split("\n");
      errorOutput.textContent = "";
      try {
        for (let line of input) {
          line = line.trim();
          if (!line || line.startsWith("//")) continue;
          const tokens = line.match(/\"[^\"]+\"|\S+/g).map(t => t.replace(/\"/g, ""));
          const cmd = tokens[0];

          if (cmd === "MKDIR") mkdir(tokens[1]);
          else if (cmd === "WRITE") writeFile(tokens[1], tokens[2]);
          else if (cmd === "READ") alert(readFile(tokens[1]) || "Файл не знайдено");
          else if (cmd === "LS") alert(listDir(tokens[1]).join("\n"));
          else if (cmd === "RM") removePath(tokens[1]);
          else throw new Error(`Невідома команда: ${cmd}`);
        }
      } catch (err) {
        errorOutput.textContent = "❌ Помилка: " + err.message;
      }
    }
  </script></body>
</html>
